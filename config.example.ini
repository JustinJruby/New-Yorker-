# Copy this file to config.ini and fill in your values.
# config.ini is gitignored so your credentials stay off GitHub.

[kindle]
# Your Send-to-Kindle address. Find it at amazon.com ->
# Account -> Content Library -> Devices -> your Kindle.
kindle_email = yourname_ABC123@kindle.com

# Output format sent to the Kindle:
#   epub -> reflowable, real chapter navigation, images (recommended)
#   pdf  -> fixed pages (with convert=true Amazon reflows it)
#   txt  -> plain text only, no images
format = epub

# PDF only: true -> Amazon converts the PDF to a reflowable Kindle
# document; false -> fixed pages. Ignored for epub/txt.
convert = true

[smtp]
# Gmail example. Use an App Password, not your real password:
# https://myaccount.google.com/apppasswords (requires 2FA enabled).
host = smtp.gmail.com
port = 465
username = you@gmail.com
password = your-16-char-app-password
# Optional; defaults to username. This address MUST be on your
# Amazon "Approved Personal Document E-mail List".
from = you@gmail.com

[scraper]
# Optional: path to a Netscape-format cookies.txt exported from a
# browser where you're logged in to newyorker.com. Without it,
# paywalled articles are truncated to the free preview.
cookies_file = cookies.txt
